[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyframe"
version = "0.8.0"
description = "A personal Python desktop workspace for studying code and screenshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials==6.11.3",
    "winrt-runtime==4.2.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Composition==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.UI.Composition.Desktop==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.System==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Numerics==4!10.0.28000.2957.1; sys_platform == 'win32'",
    "winrt-Windows.UI.Composition.Interop==4.0.0; sys_platform == 'win32'",
    "winrt-Windows.System.Interop==4.0.0; sys_platform == 'win32'",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
speech = ["SoundCard==0.4.6", "vosk==0.3.45", "numpy==2.2.6"]

[project.gui-scripts]
studyframe = "studyframe.launcher:main"

[tool.setuptools.packages.find]
include = ["studyframe*"]
