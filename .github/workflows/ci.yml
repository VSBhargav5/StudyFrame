name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 fonts-dejavu-core
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements-speech.txt
      - name: Install the application package
        run: python -m pip install --no-deps .
      - name: Verify the installed build outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from studyframe import __version__; from studyframe.app import StudyWindow; from studyframe.crop import CropDialog; assert __version__ == '0.9.0'; assert hasattr(StudyWindow, 'send_request'); assert hasattr(StudyWindow, 'start_followup'); assert hasattr(StudyWindow, 'choose_crop'); assert hasattr(StudyWindow, 'choose_screen'); assert hasattr(StudyWindow, 'capture_and_ask'); from studyframe.capture import capture_screen; from studyframe.provider import provider_config; assert provider_config('openrouter_free')['model'] == 'openrouter/free'; from studyframe.speech import SpeechSession; from vosk import KaldiRecognizer; print('Installed StudyFrame', __version__)"
      - name: Test offline behavior and actual Qt widgets
        run: python -m unittest discover -s tests -v
      - name: Render a synthetic study session
        run: python -m examples.demo --snapshot out/demo.png
      - name: Render crop editor and cropped study image
        run: |
          python -m examples.demo --crop-editor --snapshot out/crop-editor.png
          python -m examples.demo --crop --snapshot out/cropped-study.png
      - name: Render glass overlay and compact bar
        run: |
          python -m examples.demo --overlay-answer --snapshot out/glass-answer.png
          python -m examples.demo --collapsed --snapshot out/glass-collapsed.png
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-study-${{ matrix.os }}-${{ matrix.python }}
          path: out/*.png

  portable:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime and build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build a new portable app and run its offline checks
        run: python build_windows.py
      - name: Compile per-user installer from the verified portable bundle
        run: python build_installer.py --compiler "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Verify isolated install, active-session guard, reinstall and uninstall
        run: python verify_installer.py --installer out/StudyFrame-0.9.0-windows-x64-setup.exe --workspace "${{ runner.temp }}/studyframe-installer-check"
      - uses: actions/upload-artifact@v4
        with:
          name: StudyFrame-windows-x64
          path: |
            out/StudyFrame-*-windows-x64.zip
            out/portable-*/StudyFrame/runtime-check.json
            out/StudyFrame-*-windows-x64-setup.exe
